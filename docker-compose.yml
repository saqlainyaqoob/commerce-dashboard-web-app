services:
  postgres:
    image: postgres:18-alpine
    container_name: commerce_dashboard_vercel_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: commerce_dashboard
      POSTGRES_USER: commerce_admin
      POSTGRES_PASSWORD: ${PGPASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_admin -d commerce_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: commerce_dashboard_vercel_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5001:5000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: